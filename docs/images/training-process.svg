<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#f3f1ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#047857"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#6d28d9"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172554" flood-opacity="0.12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7c3aed"/></marker>
    <style>
      .title { font: 800 34px Inter, "Noto Sans SC", sans-serif; fill: #172033; }
      .subtitle { font: 500 16px Inter, "Noto Sans SC", sans-serif; fill: #64748b; }
      .label { font: 700 16px Inter, "Noto Sans SC", sans-serif; fill: #172033; }
      .body { font: 500 14px Inter, "Noto Sans SC", sans-serif; fill: #334155; }
      .small { font: 500 12px Inter, "Noto Sans SC", sans-serif; fill: #64748b; }
      .pill { font: 700 12px Inter, "Noto Sans SC", sans-serif; fill: white; }
      .line { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .lineBlue { stroke: #2563eb; stroke-width: 2.8; fill: none; marker-end: url(#arrowBlue); }
      .linePurple { stroke: #7c3aed; stroke-width: 2.8; fill: none; marker-end: url(#arrowPurple); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="70" y="70" class="title">Shopping-RL：SFT → GRPO 训练流程</text>
  <text x="70" y="102" class="subtitle">离线动作模仿建立工具策略，在线终局 Reward 优化长程决策</text>

  <rect x="70" y="140" width="1460" height="285" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="95" y="163" width="90" height="34" rx="17" fill="url(#blue)"/><text x="140" y="186" text-anchor="middle" class="pill">SFT</text>
  <text x="215" y="187" class="label">离线教师轨迹 → Action-only LoRA</text>

  <rect x="105" y="235" width="245" height="105" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="227" y="268" text-anchor="middle" class="label">Pure V4 SFT pool</text>
  <text x="227" y="293" text-anchor="middle" class="body">1,192 unique tasks</text>
  <text x="227" y="316" text-anchor="middle" class="small">teacher gold trajectories</text>
  <line x1="350" y1="288" x2="445" y2="288" class="lineBlue"/>
  <rect x="465" y="235" width="245" height="105" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="587" y="268" text-anchor="middle" class="label">Chat template</text>
  <text x="587" y="293" text-anchor="middle" class="body">tokenize / length filter</text>
  <text x="587" y="316" text-anchor="middle" class="small">tool arguments → object</text>
  <line x1="710" y1="288" x2="805" y2="288" class="line"/>
  <rect x="825" y="235" width="245" height="105" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="947" y="268" text-anchor="middle" class="label">Assistant-only labels</text>
  <text x="947" y="293" text-anchor="middle" class="body">user / tool = -100</text>
  <text x="947" y="316" text-anchor="middle" class="small">动作与工具调用计算 loss</text>
  <line x1="1070" y1="288" x2="1165" y2="288" class="line"/>
  <rect x="1185" y="235" width="280" height="105" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="1325" y="268" text-anchor="middle" class="label">LoRA curriculum</text>
  <text x="1325" y="293" text-anchor="middle" class="body">Stage A → B → C</text>
  <text x="1325" y="316" text-anchor="middle" class="small">merged checkpoint → GRPO init</text>

  <line x1="1325" y1="340" x2="1325" y2="480" class="linePurple"/>
  <rect x="1190" y="455" width="270" height="68" rx="16" fill="#172033"/>
  <text x="1325" y="484" text-anchor="middle" style="font:700 16px Inter, 'Noto Sans SC', sans-serif;fill:white">Stage C merged policy</text>
  <text x="1325" y="505" text-anchor="middle" style="font:500 12px Inter, 'Noto Sans SC', sans-serif;fill:#cbd5e1">作为 GRPO 当前策略初始化</text>

  <rect x="70" y="555" width="1460" height="300" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="95" y="578" width="105" height="34" rx="17" fill="url(#purple)"/><text x="147" y="601" text-anchor="middle" class="pill">GRPO</text>
  <text x="230" y="602" class="label">在线探索 → Reward v3 → 组内相对更新</text>

  <rect x="105" y="650" width="225" height="105" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="217" y="683" text-anchor="middle" class="label">train.parquet</text>
  <text x="217" y="708" text-anchor="middle" class="body">Prompt + task_id</text>
  <text x="217" y="731" text-anchor="middle" class="small">SFT / Final-200 零重叠</text>
  <line x1="330" y1="702" x2="420" y2="702" class="linePurple"/>
  <rect x="440" y="650" width="250" height="105" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="565" y="683" text-anchor="middle" class="label">Online rollouts</text>
  <text x="565" y="708" text-anchor="middle" class="body">n = 4 / prompt</text>
  <text x="565" y="731" text-anchor="middle" class="small">当前策略 × ShopSimulator</text>
  <line x1="690" y1="702" x2="780" y2="702" class="line"/>
  <rect x="800" y="650" width="260" height="105" rx="16" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <text x="930" y="683" text-anchor="middle" class="label">Reward v3 terminal</text>
  <text x="930" y="708" text-anchor="middle" class="body">terminal_utility</text>
  <text x="930" y="731" text-anchor="middle" class="small">gold / alternative / failure</text>
  <line x1="1060" y1="702" x2="1150" y2="702" class="line"/>
  <rect x="1170" y="635" width="290" height="135" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="1315" y="668" text-anchor="middle" class="label">Dynamic sampling</text>
  <text x="1315" y="693" text-anchor="middle" class="body">keep reward-varying groups</text>
  <text x="1315" y="718" text-anchor="middle" class="small">drop constant / invalid group</text>
  <text x="1315" y="741" text-anchor="middle" class="small">≤ 3 gen batches · ≤ 10 skips</text>
  <line x1="1315" y1="770" x2="1315" y2="822" class="linePurple"/>
  <rect x="1170" y="820" width="290" height="68" rx="16" fill="#172033"/>
  <text x="1315" y="849" text-anchor="middle" style="font:700 16px Inter, 'Noto Sans SC', sans-serif;fill:white">GRPO advantage + actor update</text>
  <text x="1315" y="870" text-anchor="middle" style="font:500 12px Inter, 'Noto Sans SC', sans-serif;fill:#cbd5e1">new policy → next online rollout</text>
  <path d="M1170 854 C1040 930 480 930 565 755" class="linePurple dashed"/>

  <rect x="70" y="900" width="1460" height="54" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
  <text x="100" y="934" class="body">可选 SAO 分支：n=1 异步 rollout + DIS（0.8&lt;r&lt;1.2）+ skip-observation GAE + Critic；不与 dynamic sampling / TRACE 同时启用。</text>
</svg>
