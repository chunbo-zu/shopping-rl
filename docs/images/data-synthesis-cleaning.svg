<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="920" viewBox="0 0 1600 920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172554" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 800 34px Inter, "Noto Sans SC", sans-serif; fill: #172033; }
      .subtitle { font: 500 16px Inter, "Noto Sans SC", sans-serif; fill: #64748b; }
      .label { font: 700 16px Inter, "Noto Sans SC", sans-serif; fill: #172033; }
      .body { font: 500 14px Inter, "Noto Sans SC", sans-serif; fill: #334155; }
      .small { font: 500 12px Inter, "Noto Sans SC", sans-serif; fill: #64748b; }
      .pill { font: 700 12px Inter, "Noto Sans SC", sans-serif; fill: white; }
      .white { fill: white; }
      .line { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .lineBlue { stroke: #2563eb; stroke-width: 2.8; fill: none; marker-end: url(#arrowBlue); }
      .dashed { stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="url(#bg)"/>
  <text x="70" y="70" class="title">Shopping-RL：数据合成与清洗</text>
  <text x="70" y="102" class="subtitle">离线教师轨迹 → Reward v3 验收 → 可训练的 action-only SFT 数据</text>

  <rect x="70" y="140" width="1460" height="145" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="92" y="163" width="132" height="34" rx="17" fill="url(#blue)"/>
  <text x="158" y="186" text-anchor="middle" class="pill">SOURCE</text>
  <text x="100" y="230" class="label">冻结任务与商品归档</text>
  <text x="100" y="255" class="body">task_id / instruction_text / target ASIN / 商品属性 / 规格 / Reward features</text>
  <line x1="595" y1="212" x2="690" y2="212" class="line"/>
  <rect x="710" y="163" width="300" height="88" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="860" y="196" text-anchor="middle" class="label">Teacher Rollout</text>
  <text x="860" y="220" text-anchor="middle" class="body">DeepSeek V4 Flash</text>
  <text x="860" y="241" text-anchor="middle" class="small">真实执行搜索、核验、选规格、购买</text>
  <line x1="1030" y1="212" x2="1125" y2="212" class="line"/>
  <rect x="1145" y="163" width="330" height="88" rx="16" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2"/>
  <text x="1310" y="196" text-anchor="middle" class="label">raw.jsonl</text>
  <text x="1310" y="220" text-anchor="middle" class="body">完整消息、工具调用、Observation、终局</text>
  <text x="1310" y="241" text-anchor="middle" class="small">当前采集审计：2,498 条原始轨迹</text>

  <rect x="70" y="335" width="1460" height="215" rx="22" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
  <rect x="92" y="358" width="160" height="34" rx="17" fill="url(#orange)"/>
  <text x="172" y="381" text-anchor="middle" class="pill">DETERMINISTIC FILTER</text>
  <text x="100" y="425" class="label">Reward v3 严格验收 + 工具协议校验</text>
  <text x="100" y="452" class="body">done / over · buy_now · gold_purchase · reward_valid · purchase_success</text>
  <text x="100" y="478" class="body">单工具调用 · JSON 参数 · tool_name 与 env_action 一致 · Action Guard 合法</text>
  <line x1="700" y1="442" x2="790" y2="442" class="line"/>
  <rect x="815" y="380" width="300" height="105" rx="16" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text x="965" y="414" text-anchor="middle" class="label">accepted.jsonl</text>
  <text x="965" y="438" text-anchor="middle" class="body">严格 Gold purchase</text>
  <text x="965" y="462" text-anchor="middle" class="small">1,026 条通过 · 41.07%</text>
  <line x1="1118" y1="418" x2="1190" y2="380" class="line"/>
  <rect x="1210" y="350" width="250" height="70" rx="14" fill="#fef2f2" stroke="#fecaca" stroke-width="2"/>
  <text x="1335" y="380" text-anchor="middle" class="label">rejected.jsonl</text>
  <text x="1335" y="402" text-anchor="middle" class="small">task_id + 确定性拒绝原因</text>
  <line x1="1118" y1="455" x2="1190" y2="493" class="line"/>
  <rect x="1210" y="458" width="250" height="70" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1335" y="488" text-anchor="middle" class="label">reject_stats.json</text>
  <text x="1335" y="510" text-anchor="middle" class="small">接受率与原因分布</text>

  <line x1="965" y1="550" x2="965" y2="615" class="lineBlue"/>
  <rect x="70" y="590" width="1460" height="170" rx="22" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="92" y="613" width="120" height="34" rx="17" fill="url(#green)"/>
  <text x="152" y="636" text-anchor="middle" class="pill">SANITIZE</text>
  <text x="100" y="684" class="label">清洗、去重、隔离和可复现划分</text>
  <text x="100" y="712" class="body">移除 Guard/runtime 消息 · 终端 Reward 文本替换 · 只保留 OpenAI chat 字段</text>
  <text x="100" y="738" class="body">排除 Final-200 · 每个 task 最多一条 · 按 task_id 稳定切分 · 保存 hash / metadata</text>
  <line x1="760" y1="690" x2="845" y2="690" class="line"/>
  <rect x="870" y="622" width="255" height="90" rx="16" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="997" y="656" text-anchor="middle" class="label">历史 SFT split</text>
  <text x="997" y="680" text-anchor="middle" class="body">800 train / 200 validation</text>
  <text x="997" y="700" text-anchor="middle" class="small">task-disjoint</text>
  <line x1="1140" y1="690" x2="1210" y2="690" class="line"/>
  <rect x="1230" y="622" width="250" height="90" rx="16" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="2"/>
  <text x="1355" y="656" text-anchor="middle" class="label">Pure V4 curriculum</text>
  <text x="1355" y="680" text-anchor="middle" class="body">1,192 unique tasks</text>
  <text x="1355" y="700" text-anchor="middle" class="small">1,073 train / 119 validation</text>

  <rect x="70" y="800" width="1460" height="74" rx="18" fill="#172033"/>
  <text x="100" y="831" class="white" style="font:700 15px Inter, 'Noto Sans SC', sans-serif">训练期标签策略</text>
  <text x="100" y="855" style="font:500 14px Inter, 'Noto Sans SC', sans-serif;fill:#cbd5e1">chat template 渲染完整轨迹；system / user / tool token = -100；只对 assistant 动作（含工具调用）计算 SFT loss。</text>
</svg>
